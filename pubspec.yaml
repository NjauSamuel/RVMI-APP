name: rvmi_media
description: "RVMI Media — church photo & video library, event discussions, and asset inventory."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  dio: ^5.11.1
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  google_fonts: ^8.2.1
  package_info_plus: ^10.2.1
  intl: ^0.20.3
  connectivity_plus: ^7.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.2

  # Media viewing / Telegram-style progressive loading.
  flutter_blurhash: ^0.9.1
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  visibility_detector: ^0.4.0+2

  # Upload pickers + video.
  mime: ^2.0.0
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  video_player: ^2.10.0
  chewie: ^1.11.3
  # Frame grab for the review/gallery poster. Not video_thumbnail — that
  # package still calls the removed Gradle jcenter() API.
  fc_native_video_thumbnail: ^3.0.1

  # Sharing actual files (e.g. to WhatsApp) instead of links.
  share_plus: ^13.3.0

  # PDF/receipt preview for inventory.
  printing: ^5.14.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_image_compress: ^2.5.1
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/branding/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/ic_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/ic_launcher.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23

flutter_native_splash:
  color: "#5B21B6"
  image: "assets/icon/splash_icon.png"
  color_dark: "#5B21B6"
  image_dark: "assets/icon/splash_icon.png"
  android_12:
    color: "#5B21B6"
    image: "assets/icon/splash_icon.png"
    icon_background_color: "#5B21B6"
    color_dark: "#5B21B6"
    image_dark: "assets/icon/splash_icon.png"
    icon_background_color_dark: "#5B21B6"
